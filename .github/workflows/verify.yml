name: Universal

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: universal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Matrix contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: matrix
        working-directory: pulse-app/cli
        shell: bash
        run: |
          node scripts/native-universal-matrix.mjs --check
          echo "value=$(node scripts/native-universal-matrix.mjs --github)" >> "$GITHUB_OUTPUT"

  quality:
    name: Full product suite
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pulse-app/cli/package-lock.json
            mcp/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.6
          cache-dependency-path: pulse-app/go.sum
      - name: Verify full Go suite
        working-directory: pulse-app
        run: go test ./...
      - name: Build and verify full MCP suite
        working-directory: mcp
        run: |
          npm ci --ignore-scripts
          npm run build
          npm test
      - name: Verify full CLI suite
        working-directory: pulse-app/cli
        run: |
          npm ci --ignore-scripts
          npm test

  native:
    name: Native / ${{ matrix.target_id }} / ${{ matrix.host }}
    needs: contract
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contract.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
          cache-dependency-path: |
            pulse-app/cli/package-lock.json
            mcp/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go_version }}
          cache-dependency-path: pulse-app/go.sum
      - name: Install exact harness calibration
        if: matrix.harness_distribution == 'npm'
        shell: bash
        run: |
          test "$(npm view "${{ matrix.harness_identity }}@${{ matrix.harness_version }}" dist.tarball)" = "${{ matrix.harness_download_url }}"
          npm install --global "${{ matrix.harness_identity }}@${{ matrix.harness_version }}"
          "${{ matrix.harness_executable }}" --version
      - name: Pin Cursor vendor identity for fixture authority
        if: matrix.harness_distribution == 'vendor-desktop-installer'
        shell: bash
        run: |
          test "${{ matrix.harness_vendor_source }}" = "https://cursor.com/download"
          test "${{ matrix.harness_identity }}" = "Cursor Desktop"
          test "${{ matrix.harness_download_url }}" = "$(node -e "const m=require('./pulse-app/cli/scripts/native-universal-matrix.json'); const h=m.harnesses.find(x=>x.host==='cursor'); process.stdout.write(h.downloads['${{ matrix.target_id }}'])")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --max-redirs 1 \
            --connect-timeout 15 --max-time 600 \
            --write-out '%{url_effective}\n' --output "$RUNNER_TEMP/cursor-installer" \
            "${{ matrix.harness_download_url }}" > "$RUNNER_TEMP/cursor-effective-url"
          grep -Eq '^https://downloads\.cursor\.com/production/[a-f0-9]{40}/' "$RUNNER_TEMP/cursor-effective-url"
          test -s "$RUNNER_TEMP/cursor-installer"
          node -e "const c=require('crypto'),f=require('fs'); process.stdout.write(c.createHash('sha256').update(f.readFileSync(process.argv[1])).digest('hex')+'\n')" \
            "$RUNNER_TEMP/cursor-installer" > "$RUNNER_TEMP/cursor-installer.sha256"
      - name: Verify and expose signed Cursor Desktop on macOS
        if: matrix.harness_distribution == 'vendor-desktop-installer' && matrix.platform == 'darwin'
        shell: bash
        run: |
          mv "$RUNNER_TEMP/cursor-installer" "$RUNNER_TEMP/cursor.dmg"
          mount="$(hdiutil attach -readonly -nobrowse "$RUNNER_TEMP/cursor.dmg" | awk '/\/Volumes\// {sub(/^.*\/Volumes\//,"/Volumes/"); print; exit}')"
          test -d "$mount/Cursor.app"
          ditto "$mount/Cursor.app" "$RUNNER_TEMP/Cursor.app"
          hdiutil detach "$mount"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/Cursor.app"
          spctl --assess --type execute --verbose=2 "$RUNNER_TEMP/Cursor.app"
          version="$(defaults read "$RUNNER_TEMP/Cursor.app/Contents/Info" CFBundleShortVersionString)"
          [[ "$version" = 3.13 || "$version" = 3.13.* ]]
          test -x "$RUNNER_TEMP/Cursor.app/Contents/MacOS/Cursor"
          echo "PULSE_CURSOR_EXECUTABLE=$RUNNER_TEMP/Cursor.app/Contents/MacOS/Cursor" >> "$GITHUB_ENV"
      - name: Verify and expose Cursor Desktop on GNU/Linux
        if: matrix.harness_distribution == 'vendor-desktop-installer' && matrix.platform == 'linux'
        shell: bash
        run: |
          mv "$RUNNER_TEMP/cursor-installer" "$RUNNER_TEMP/cursor.deb"
          version="$(dpkg-deb --field "$RUNNER_TEMP/cursor.deb" Version)"
          [[ "$version" = 3.13 || "$version" = 3.13.* ]]
          test "$(dpkg-deb --field "$RUNNER_TEMP/cursor.deb" Package)" = cursor
          mkdir "$RUNNER_TEMP/cursor-root"
          dpkg-deb --extract "$RUNNER_TEMP/cursor.deb" "$RUNNER_TEMP/cursor-root"
          test -x "$RUNNER_TEMP/cursor-root/usr/share/cursor/cursor"
          sandbox="$RUNNER_TEMP/cursor-root/usr/share/cursor/chrome-sandbox"
          test -f "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          test "$(stat -c '%U:%G %a' "$sandbox")" = 'root:root 4755'
          echo "PULSE_CURSOR_EXECUTABLE=$RUNNER_TEMP/cursor-root/usr/share/cursor/cursor" >> "$GITHUB_ENV"
      - name: Verify and expose signed Cursor Desktop on Windows
        if: matrix.harness_distribution == 'vendor-desktop-installer' && matrix.platform == 'win32'
        shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'cursor-installer'
          $installer = Join-Path $env:RUNNER_TEMP 'cursor-installer.exe'
          Move-Item -LiteralPath $download -Destination $installer
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Anysphere') {
            throw 'Cursor Authenticode verification failed'
          }
          $destination = Join-Path $env:RUNNER_TEMP 'Cursor'
          $process = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$destination"
          ) -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Cursor installer failed: $($process.ExitCode)" }
          $executable = Join-Path $destination 'Cursor.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw 'Cursor executable is missing' }
          $version = (Get-Item -LiteralPath $executable).VersionInfo.ProductVersion
          if ($version -notmatch '^3\.13(?:\.|$)') { throw "Cursor version mismatch: $version" }
          "PULSE_CURSOR_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build native Go product
        working-directory: pulse-app
        shell: bash
        run: |
          go build ./cmd/pulse ./cmd/pulse-fixture-embedder
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            go test ./cmd/pulse-platform-adapter
            go test ./internal/config -run '^TestLoadVaultPinsKindAndStoreIdentity$'
          fi
      - name: Build native MCP package
        working-directory: mcp
        shell: bash
        run: |
          npm ci --ignore-scripts
          npx tsc
      - name: Install native CLI dependencies
        working-directory: pulse-app/cli
        shell: bash
        run: npm ci --ignore-scripts
      - name: Prove exact packed Personal continuity
        working-directory: pulse-app/cli
        shell: bash
        run: >-
          npm run test:native-universal-target --
          --host "${{ matrix.host }}"
          --target "${{ matrix.target_id }}"
          --repeat "${{ matrix.stability_runs }}"
          --out ".pulse-ci/evidence/${{ matrix.host }}-${{ matrix.target_id }}.json"
      - name: Upload content-free target evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulse-native-${{ matrix.host }}-${{ matrix.target_id }}
          path: pulse-app/cli/.pulse-ci/evidence/${{ matrix.host }}-${{ matrix.target_id }}.json
          if-no-files-found: error
          retention-days: 30

  universal-required:
    name: Universal / required
    if: always()
    needs: [contract, quality, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: needs.native.result == 'success'
        with:
          pattern: pulse-native-*
          path: native-evidence
      - name: Require every native target
        env:
          CONTRACT_RESULT: ${{ needs.contract.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        shell: bash
        run: |
          test "$CONTRACT_RESULT" = success
          test "$QUALITY_RESULT" = success
          test "$NATIVE_RESULT" = success
          node pulse-app/cli/scripts/validate-native-evidence-set.mjs \
            --directory native-evidence --authority fixture
