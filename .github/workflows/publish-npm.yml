name: Publish Pulse Personal to npm

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested package to npm after the Mac install succeeds
        required: true
        default: false
        type: boolean

concurrency:
  group: publish-pulse-personal-to-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish the reviewed Personal package
    if: github.repository == 'zbs-gg/pulse'
    runs-on: macos-15
    timeout-minutes: 35
    env:
      EXPECTED_PACKAGE: '@zbs-gg/pulse'
      EXPECTED_VERSION: '0.7.2'
      EXPECTED_TREE_SHA256: 97557d8af16106583ead0f86fdb8f00b1e4c278f57efa6a0124775a78169832a
      EXPECTED_ARTIFACT_SET_SHA256: 4023182649ca46cf4548351a74ab46defc32207c9eaab54c70c8856d1fa722f3
      EXPECTED_SNAPSHOT_SHA256: 51ff82ed9e9cbcb1c3ec2aff1ba522b26a34121e758b6083253489391a3f7793
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Use an npm version that supports trusted publishing
        shell: bash
        run: |
          npm install --global npm@11.18.0
          test "$(node --version)" = v24.4.1
          test "$(npm --version)" = 11.18.0
          test -z "${NODE_AUTH_TOKEN:-}"
          test -z "${NPM_TOKEN:-}"

      - name: Build and inspect the package
        working-directory: pulse-app/cli
        shell: bash
        env:
          PULSE_REQUIRE_RELEASE_MANIFEST: '1'
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(node -p "require('./package.json').name")" = "$EXPECTED_PACKAGE"
          test "$(node -p "require('./package.json').version")" = "$EXPECTED_VERSION"
          if npm view "$EXPECTED_PACKAGE@$EXPECTED_VERSION" version >/dev/null 2>&1; then
            echo "$EXPECTED_PACKAGE@$EXPECTED_VERSION is already published"
            exit 1
          fi

          npm ci --ignore-scripts
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output release/personal-preview-manifest.json \
            https://pulse-personal-releases-zbs.storage.googleapis.com/pulse/0.7.2/epoch-9/catalog/artifact-set.json
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output release/personal-release-snapshot.json \
            https://pulse-personal-releases-zbs.storage.googleapis.com/pulse/0.7.2/catalog/snapshot.json
          test "$(shasum -a 256 release/personal-preview-manifest.json | cut -d ' ' -f 1)" = "$EXPECTED_ARTIFACT_SET_SHA256"
          test "$(shasum -a 256 release/personal-release-snapshot.json | cut -d ' ' -f 1)" = "$EXPECTED_SNAPSHOT_SHA256"
          package_dir="$RUNNER_TEMP/pulse-package"
          unpack_dir="$RUNNER_TEMP/pulse-unpacked"
          mkdir -p "$package_dir" "$unpack_dir"
          npm pack --json --silent --pack-destination "$package_dir" > "$RUNNER_TEMP/npm-pack.json"
          archive_name="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1]))[0].filename" "$RUNNER_TEMP/npm-pack.json")"
          archive="$package_dir/$archive_name"
          test -f "$archive"
          tar -xzf "$archive" -C "$unpack_dir"
          node scripts/public-package-audit.mjs "$unpack_dir/package"

          tree_sha256="$(node --input-type=module - "$unpack_dir/package" <<'NODE'
          import { createHash } from 'node:crypto';
          import { lstatSync, readdirSync, readFileSync } from 'node:fs';
          import { join, relative } from 'node:path';

          const root = process.argv[2];
          const files = [];
          const walk = (directory) => {
            for (const name of readdirSync(directory).sort()) {
              const path = join(directory, name);
              const stat = lstatSync(path);
              if (stat.isDirectory()) walk(path);
              else files.push(path);
            }
          };
          walk(root);
          const hash = createHash('sha256');
          for (const path of files) {
            const stat = lstatSync(path);
            hash.update(relative(root, path).split('\\').join('/'));
            hash.update('\0');
            hash.update((stat.mode & 0o777).toString(8));
            hash.update('\0');
            hash.update(readFileSync(path));
            hash.update('\0');
          }
          process.stdout.write(hash.digest('hex'));
          NODE
          )"
          test "$tree_sha256" = "$EXPECTED_TREE_SHA256"
          echo "Package content SHA-256: $tree_sha256"
          shasum -a 256 "$archive"
          echo "PULSE_NPM_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Install the exact archive on a clean Mac
        shell: bash
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/pulse-home"
          install="$RUNNER_TEMP/pulse-install"
          workspace="$RUNNER_TEMP/pulse-workspace"
          mkdir -p "$home" "$install" "$workspace"
          git -C "$workspace" init -q
          npm install --ignore-scripts --no-audit --no-fund --prefix "$install" "$PULSE_NPM_ARCHIVE"
          npm install --ignore-scripts --no-audit --no-fund --prefix "$install" @openai/codex@0.146.1
          cli="$install/node_modules/@zbs-gg/pulse/src/cli.js"
          export PATH="$install/node_modules/.bin:$PATH"
          HOME="$home" PULSE_DATA_DIR="$home/.pulse" node "$cli" --help >/dev/null
          HOME="$home" PULSE_DATA_DIR="$home/.pulse" node "$cli" init codex --only codex --yes --json \
            > "$RUNNER_TEMP/pulse-install.json"
          node -e 'const r=require(process.argv[1]); if (r.outcome!=="ready" || r.reason_code!=="installed" || r.host_status?.hosts?.[0]?.installed!==true) process.exit(1)' \
            "$RUNNER_TEMP/pulse-install.json"

      - name: Publish through GitHub trusted publishing
        if: github.ref == 'refs/heads/main' && inputs.publish
        working-directory: pulse-app/cli
        shell: bash
        run: npm publish "$PULSE_NPM_ARCHIVE" --ignore-scripts --access public --tag latest --provenance
